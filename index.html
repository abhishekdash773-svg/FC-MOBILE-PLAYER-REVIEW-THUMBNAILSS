<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Generator</title>
  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-dark: #aa7c11;
      --bg-dark: #0d0d11;
      --panel-bg: rgba(22, 22, 28, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1300px;
      width: 100%;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .main-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    .canvas-container {
      position: relative;
      border: 2px solid var(--gold-dark);
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
      overflow: hidden;
      background: #000;
      width: 100%;
      max-width: 850px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .controls-panel {
      background: var(--panel-bg);
      border: 1px solid var(--gold-dark);
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(12px);
    }

    .form-group {
      margin-bottom: 18px;
    }

    input[type="file"] {
      display: none;
    }

    .file-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
      color: #000;
      font-weight: bold;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .file-btn:hover {
      opacity: 0.9;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border: none;
      border-radius: 6px;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      transition: transform 0.1s;
    }

    .download-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="canvas-container">
      <canvas id="thumbCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="controls-panel">
      <!-- Card Art Upload -->
      <div class="form-group">
        <label for="cardImgInput" class="file-btn">Upload Card Art (PNG)</label>
        <input type="file" id="cardImgInput" accept="image/*">
      </div>

      <button class="download-btn" id="downloadBtn">Download Thumbnail</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('thumbCanvas');
    const ctx = canvas.getContext('2d');

    // Locked Background from repo
    const bgImage = new Image();
    bgImage.src = 'background.jpg';

    let cardImage = null;

    // Fixed placement slot on the background frame
    const TARGET_HEIGHT = 265; // Fixed height fitting the left card slot
    const CARD_X_CENTER = 126; // Center horizontal position for the left card slot
    const CARD_Y_BOTTOM = 490; // Bottom alignment point inside the left card slot

    bgImage.onload = renderCanvas;

    // Custom Card Art upload handler
    document.getElementById('cardImgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          cardImage = new Image();
          cardImage.onload = renderCanvas;
          cardImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function renderCanvas() {
      // 1. Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. Draw Locked Background Image
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 3. Draw Card Art Image maintaining natural aspect ratio
      if (cardImage) {
        const aspectRatio = cardImage.width / cardImage.height;
        const renderHeight = TARGET_HEIGHT;
        const renderWidth = TARGET_HEIGHT * aspectRatio;

        // Keep card centered horizontally and aligned at the bottom slot
        const renderX = CARD_X_CENTER - (renderWidth / 2);
        const renderY = CARD_Y_BOTTOM - renderHeight;

        ctx.drawImage(cardImage, renderX, renderY, renderWidth, renderHeight);
      }
    }

    renderCanvas();

    // Download handler
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'thumbnail.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });
  </script>
</body>
</html>
