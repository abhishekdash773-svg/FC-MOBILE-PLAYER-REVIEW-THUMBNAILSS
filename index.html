<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Generator</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151d2a;
      --input-bg: #0d131d;
      --border-color: #232d3f;
      --blue-accent: #2563eb;
      --blue-hover: #1d4ed8;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 650px;
      width: 100%;
      align-items: center;
    }

    .canvas-container {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .file-input-wrapper {
      position: relative;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
    }

    input[type="file"] {
      color: var(--text-muted);
      font-size: 0.9rem;
      width: 100%;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: #fff;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 12px;
    }

    .download-btn {
      width: 100%;
      padding: 16px;
      background: var(--blue-accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 5px;
    }

    .download-btn:hover {
      background: var(--blue-hover);
    }

    .download-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="canvas-container">
      <canvas id="thumbCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="controls-panel">
      <!-- Card Art Upload -->
      <div class="form-group">
        <label for="cardImgInput">Player Card Image (PNG):</label>
        <div class="file-input-wrapper">
          <input type="file" id="cardImgInput" accept="image/*">
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Download Thumbnail</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('thumbCanvas');
    const ctx = canvas.getContext('2d');

    // Locked Background from repository
    const bgImage = new Image();
    bgImage.src = 'background.jpg';

    let cardImage = null;

    // Left card slot dimensions
    const SLOT = {
      x: 15,
      y: 110,
      width: 500,
      height: 500
    };

    bgImage.onload = renderCanvas;

    // Custom Card Art upload handler
    document.getElementById('cardImgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          cardImage = new Image();
          cardImage.onload = renderCanvas;
          cardImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function renderCanvas() {
      // 1. Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. Draw Background Image
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 3. Draw Card Art proportionally centered inside the slot (Zero text overlays)
      if (cardImage) {
        const scale = Math.min(
          SLOT.width / cardImage.width,
          SLOT.height / cardImage.height
        );

        const renderWidth = cardImage.width * scale;
        const renderHeight = cardImage.height * scale;

        const renderX = SLOT.x + (SLOT.width - renderWidth) / 2;
        const renderY = SLOT.y + (SLOT.height - renderHeight) / 2;

        ctx.drawImage(cardImage, renderX, renderY, renderWidth, renderHeight);
      }
    }

    renderCanvas();

    // Download handler
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'thumbnail.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });
  </script>
</body>
</html>
