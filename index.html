
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Mobile Player Review Maker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:#101014;color:#fff;
  font-family:Arial,sans-serif
}
h1{text-align:center;color:#e7bd62;font-size:23px}
.subtitle{text-align:center;color:#bbb;font-size:13px}
.wrap{max-width:850px;margin:18px auto}
.preview{
  padding:7px;background:#202020;border-radius:10px;
}
canvas{
  width:100%;height:auto;display:block;aspect-ratio:16/9;
  background:#171717;border-radius:4px
}
.panel{
  margin-top:15px;padding:18px;background:#1b1b22;
  border-radius:12px
}
label{display:block;margin:13px 0 7px;font-size:14px}
input[type=text]{
  width:100%;padding:12px;background:#101014;color:#fff;
  border:1px solid #444;border-radius:7px;font-size:16px
}
input[type=file]{width:100%;font-size:13px}
button{
  width:100%;margin-top:18px;padding:14px;border:0;
  border-radius:8px;background:#e7bd62;color:#16120a;
  font-size:16px;font-weight:bold
}
.note{font-size:12px;line-height:1.6;color:#bbb}
</style>
</head>
<body>

<h1>⚽ PLAYER REVIEW MAKER</h1>
<p class="subtitle">FC MOBILE • BALLON D'OR EDITION</p>

<div class="wrap">
  <div class="preview">
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  <div class="panel">
    <label for="player">Player Name</label>
    <input id="player" type="text" value="ZIDANE" maxlength="28">

    <label for="creator">Your Name (BY:)</label>
    <input id="creator" type="text" value="YOUR NAME" maxlength="35">

    <label for="card">Upload Player Card (transparent PNG recommended)</label>
    <input id="card" type="file" accept="image/png,image/webp,image/*">

    <button id="download">DOWNLOAD THUMBNAIL PNG</button>

    <p class="note">
      Fixed 16:9 layout • 1280 × 720 • No text or card boxes.
      Background, font, layout and positions are fixed by the website owner.
      Use a transparent PNG for the cleanest card result.
    </p>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const playerInput = document.getElementById("player");
const creatorInput = document.getElementById("creator");
const cardInput = document.getElementById("card");

let background = new Image();
let backgroundReady = false;
let playerCard = null;

// The website owner controls the background filename here.
// Replace background.jpg in the repository to change the design.
background.onload = () => {
  backgroundReady = true;
  draw();
};
background.onerror = () => {
  backgroundReady = false;
  draw();
};
background.src = "background.jpg";

// Fixed layout: visitors cannot move or resize these elements.
const CARD = { x: 65, y: 85, w: 365, h: 550 };
const HEADLINE = { x: 475, y: 310, maxWidth: 770 };
const CREDIT = { x: 480, y: 385, maxWidth: 730 };

function drawBackground() {
  if (!backgroundReady) {
    const g = ctx.createLinearGradient(0, 0, 1280, 720);
    g.addColorStop(0, "#11111b");
    g.addColorStop(0.5, "#302719");
    g.addColorStop(1, "#09090e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1280, 720);

    ctx.fillStyle = "#e7bd62";
    ctx.font = "bold 32px Arial";
    ctx.textAlign = "center";
    ctx.fillText("UPLOAD background.jpg TO YOUR REPOSITORY", 640, 360);
    return;
  }

  const scale = Math.max(
    1280 / background.width,
    720 / background.height
  );
  const w = background.width * scale;
  const h = background.height * scale;

  ctx.drawImage(
    background,
    (1280 - w) / 2,
    (720 - h) / 2,
    w,
    h
  );
}

function fitCard() {
  if (!playerCard) return;

  const scale = Math.min(
    CARD.w / playerCard.width,
    CARD.h / playerCard.height
  );

  const w = playerCard.width * scale;
  const h = playerCard.height * scale;

  // Center the uploaded card inside its fixed area.
  ctx.drawImage(
    playerCard,
    CARD.x + (CARD.w - w) / 2,
    CARD.y + (CARD.h - h) / 2,
    w,
    h
  );
}

function fitFont(text, maxWidth, initialSize, minSize) {
  let size = initialSize;

  while (size > minSize) {
    ctx.font = `900 ${size}px Cinzel, Georgia, serif`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size--;
  }

  return size;
}

function drawHeadline() {
  const name = playerInput.value.trim() || "PLAYER";
  const suffix = " PLAYER REVIEW IS LIVE!";
  const fullText = name + suffix;

  const size = fitFont(fullText, HEADLINE.maxWidth, 43, 12);

  ctx.font = `900 ${size}px Cinzel, Georgia, serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";

  // Same font, size and weight across the entire headline.
  const gradient = ctx.createLinearGradient(
    HEADLINE.x, HEADLINE.y - size / 2,
    HEADLINE.x, HEADLINE.y + size / 2
  );
  gradient.addColorStop(0, "#fff0b3");
  gradient.addColorStop(0.35, "#e8c56f");
  gradient.addColorStop(0.7, "#bd8732");
  gradient.addColorStop(1, "#fff0b3");

  ctx.fillStyle = gradient;
  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 3;

  // A single line; font shrinks if the name is long.
  ctx.fillText(fullText, HEADLINE.x, HEADLINE.y, HEADLINE.maxWidth);

  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}

function drawCredit() {
  const text = "BY: " + (creatorInput.value.trim() || "YOUR NAME");
  const size = fitFont(text, CREDIT.maxWidth, 27, 12);

  ctx.font = `900 ${size}px Cinzel, Georgia, serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";

  const gradient = ctx.createLinearGradient(
    CREDIT.x, CREDIT.y - size / 2,
    CREDIT.x, CREDIT.y + size / 2
  );
  gradient.addColorStop(0, "#ffffff");
  gradient.addColorStop(1, "#d6b56b");

  ctx.fillStyle = gradient;
  ctx.shadowColor = "rgba(0,0,0,0.9)";
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 2;

  ctx.fillText(text, CREDIT.x, CREDIT.y, CREDIT.maxWidth);

  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
}

function draw() {
  ctx.clearRect(0, 0, 1280, 720);
  drawBackground();

  // No panel, rectangle or frame behind the card.
  if (playerCard) fitCard();

  // Text is drawn directly on top of the background.
  drawHeadline();
  drawCredit();
}

playerInput.addEventListener("input", draw);
creatorInput.addEventListener("input", draw);

cardInput.addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    playerCard = img;
    draw();
    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    alert("Image could not be loaded. Try another PNG.");
  };

  img.src = url;
});

document.getElementById("download").addEventListener("click", async () => {
  await document.fonts.ready;
  draw();

  canvas.toBlob(blob => {
    if (!blob) {
      alert("Could not export the thumbnail. Please try again.");
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    const safeName = (playerInput.value.trim() || "PLAYER")
      .replace(/[^a-z0-9_-]/gi, "_");

    link.href = url;
    link.download = safeName + "_PLAYER_REVIEW.png";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, "image/png");
});

document.fonts.ready.then(draw);
draw();
</script>
</body>
</html>
