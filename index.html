<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Art Generator</title>
  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-dark: #aa7c11;
      --bg-dark: #0a0a0c;
      --panel-bg: rgba(18, 18, 22, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      align-items: center;
    }

    @media (min-width: 900px) {
      .main-container {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
      }
    }

    .canvas-wrapper {
      position: relative;
      border: 2px solid var(--gold-dark);
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
      overflow: hidden;
      background: #000;
      max-width: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .controls-panel {
      background: var(--panel-bg);
      border: 1px solid var(--gold-dark);
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #ccc;
      margin-bottom: 5px;
    }

    input[type="file"] {
      display: none;
    }

    .file-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
      color: #000;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .file-btn:hover {
      opacity: 0.9;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .slider-group input[type="range"] {
      flex: 1;
      accent-color: var(--gold-primary);
    }

    .slider-group span {
      width: 40px;
      font-size: 0.85rem;
      text-align: right;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="canvas-wrapper">
      <canvas id="cardCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="controls-panel">
      <!-- Player Image Upload -->
      <div class="form-group">
        <label for="playerImgInput" class="file-btn">Upload Player Image (PNG)</label>
        <input type="file" id="playerImgInput" accept="image/*">
      </div>

      <!-- Player Controls -->
      <div class="form-group">
        <div class="slider-group">
          <label>Scale</label>
          <input type="range" id="scaleInput" min="0.2" max="2.5" step="0.05" value="1">
          <span id="scaleVal">1.0</span>
        </div>
        <div class="slider-group">
          <label>X-Pos</label>
          <input type="range" id="posXInput" min="-300" max="500" value="0">
          <span id="posXVal">0</span>
        </div>
        <div class="slider-group">
          <label>Y-Pos</label>
          <input type="range" id="posYInput" min="-300" max="500" value="0">
          <span id="posYVal">0</span>
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Download Image</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    // Load background image from repo
    const bgImage = new Image();
    bgImage.src = 'background.jpg';

    let playerImage = null;

    // Control Elements
    const playerImgInput = document.getElementById('playerImgInput');
    const scaleInput = document.getElementById('scaleInput');
    const posXInput = document.getElementById('posXInput');
    const posYInput = document.getElementById('posYInput');

    bgImage.onload = renderCanvas;

    playerImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          playerImage = new Image();
          playerImage.onload = renderCanvas;
          playerImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    [scaleInput, posXInput, posYInput].forEach(input => {
      input.addEventListener('input', () => {
        document.getElementById('scaleVal').innerText = scaleInput.value;
        document.getElementById('posXVal').innerText = posXInput.value;
        document.getElementById('posYVal').innerText = posYInput.value;
        renderCanvas();
      });
    });

    function renderCanvas() {
      // Draw Background
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Draw Player Image (No text is rendered)
      if (playerImage) {
        const scale = parseFloat(scaleInput.value);
        const offsetX = parseInt(posXInput.value);
        const offsetY = parseInt(posYInput.value);

        const imgW = playerImage.width * scale;
        const imgH = playerImage.height * scale;

        ctx.drawImage(playerImage, offsetX, offsetY, imgW, imgH);
      }
    }

    renderCanvas();

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'card-image.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
