<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Event Banner Maker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Preview Canvas Wrapper */
    .preview-card {
      width: 100%;
      background: #161b22;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    /* Form Container */
    .form-card {
      background-color: #161f2e;
      border: 1px solid #212e40;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 14px;
      color: #919eab;
      font-weight: 500;
    }

    .input-group input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #0b111a;
      border: 1px solid #233043;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input[type="text"]:focus {
      border-color: #3b82f6;
    }

    .file-input-wrapper {
      background-color: #0b111a;
      border: 1px solid #233043;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
    }

    .file-input-wrapper input[type="file"] {
      color: #919eab;
      font-size: 14px;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .download-btn:hover {
      background-color: #1d4ed8;
    }

    .download-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Live Preview Banner -->
    <div class="preview-card">
      <canvas id="bannerCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- User Controls -->
    <div class="form-card">
      <div class="input-group">
        <label for="playerName">Player Name:</label>
        <input type="text" id="playerName" value="LAYUN" placeholder="Enter Player Name">
      </div>

      <div class="input-group">
        <label for="playerStats">Info / Stats:</label>
        <input type="text" id="playerStats" value="120 | RB | MADHAV" placeholder="Enter Info / Stats">
      </div>

      <div class="input-group">
        <label for="cardUpload">Player Card Image:</label>
        <div class="file-input-wrapper">
          <input type="file" id="cardUpload" accept="image/*">
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Download Banner</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');

    const playerNameInput = document.getElementById('playerName');
    const playerStatsInput = document.getElementById('playerStats');
    const cardUploadInput = document.getElementById('cardUpload');
    const downloadBtn = document.getElementById('downloadBtn');

    // Default/Locked Background Image (Loads background.jpg from your repo)
    const bgImage = new Image();
    bgImage.src = 'background.jpg';

    // Player Card Image State
    let cardImage = null;

    // Redraw Canvas function matching Image 2 Layout
    function drawCanvas() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Background Image
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        // Fallback gradient if background.jpg is missing/loading
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, '#4a00e0');
        grad.addColorStop(1, '#8e2de2');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Draw Uploaded Player Card (Left Side)
      if (cardImage) {
        const cardWidth = 240;
        const cardHeight = 320;
        const cardX = 25;
        const cardY = 330;
        ctx.drawImage(cardImage, cardX, cardY, cardWidth, cardHeight);
      }

      // 3. Draw Player Text Elements
      const textStartX = cardImage ? 280 : 250;
      const textStartY = 480;

      // Player Name
      const nameText = playerNameInput.value.toUpperCase();
      ctx.font = '900 48px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 4;
      ctx.fillText(nameText, textStartX, textStartY);

      // Reset Shadow for Badge
      ctx.shadowColor = 'transparent';

      // Stats Green Badge Background
      const statsText = playerStatsInput.value.toUpperCase();
      if (statsText.trim() !== '') {
        ctx.font = '600 22px sans-serif';
        const textMetrics = ctx.measureText(statsText);
        const badgeWidth = textMetrics.width + 24;
        const badgeHeight = 36;
        const badgeX = textStartX;
        const badgeY = textStartY + 16;
        const radius = 6;

        // Draw rounded badge container
        ctx.fillStyle = 'rgba(10, 80, 60, 0.85)';
        ctx.strokeStyle = '#00ffaa';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, radius);
        ctx.fill();
        ctx.stroke();

        // Stats Text Inside Badge
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(statsText, badgeX + (badgeWidth / 2), badgeY + 26);
      }
    }

    // Event Listeners for Live Preview
    bgImage.onload = drawCanvas;
    playerNameInput.addEventListener('input', drawCanvas);
    playerStatsInput.addEventListener('input', drawCanvas);

    // Handle Player Card Image Upload
    cardUploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          cardImage = new Image();
          cardImage.onload = drawCanvas;
          cardImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle High-Res Download
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `${playerNameInput.value.trim() || 'banner'}_review.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Initial render call
    drawCanvas();
  </script>
</body>
</html>
