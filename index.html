<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Review Banner Generator</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151d2a;
      --input-bg: #0d131d;
      --border-color: #232d3f;
      --blue-accent: #2563eb;
      --blue-hover: #1d4ed8;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 650px;
      width: 100%;
      align-items: center;
    }

    .canvas-container {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--blue-accent);
    }

    .file-input-wrapper {
      position: relative;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
    }

    input[type="file"] {
      color: var(--text-muted);
      font-size: 0.9rem;
      width: 100%;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: #fff;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 12px;
    }

    .download-btn {
      width: 100%;
      padding: 16px;
      background: var(--blue-accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .download-btn:hover {
      background: var(--blue-hover);
    }

    .download-btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="canvas-container">
      <canvas id="bannerCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="controls-panel">
      <!-- Player Name -->
      <div class="form-group">
        <label for="playerNameInput">Player Name:</label>
        <input type="text" id="playerNameInput" value="LAYUN">
      </div>

      <!-- Info / Stats -->
      <div class="form-group">
        <label for="playerInfoInput">Info / Stats:</label>
        <input type="text" id="playerInfoInput" value="120 | RB | MADHAV">
      </div>

      <!-- Player Card Image Upload -->
      <div class="form-group">
        <label for="cardImgInput">Player Card Image:</label>
        <div class="file-input-wrapper">
          <input type="file" id="cardImgInput" accept="image/*">
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Download Banner</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');

    // Locked Background from repository
    const bgImage = new Image();
    bgImage.src = 'background.jpg';

    let cardImage = null;

    // Control Elements
    const nameInput = document.getElementById('playerNameInput');
    const infoInput = document.getElementById('playerInfoInput');
    const cardImgInput = document.getElementById('cardImgInput');

    bgImage.onload = renderCanvas;

    // Handle custom Card Art upload
    cardImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          cardImage = new Image();
          cardImage.onload = renderCanvas;
          cardImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Event listeners for text inputs
    nameInput.addEventListener('input', renderCanvas);
    infoInput.addEventListener('input', renderCanvas);

    function renderCanvas() {
      // 1. Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. Draw Background Image
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        // Fallback banner background color matching the purple in the preview
        ctx.fillStyle = '#6b21a8';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 3. Draw Player Card PNG (Left side slot)
      if (cardImage) {
        const cardX = 60;
        const cardY = 160;
        const cardWidth = 320;
        const cardHeight = 440;

        const scale = Math.min(cardWidth / cardImage.width, cardHeight / cardImage.height);
        const renderW = cardImage.width * scale;
        const renderH = cardImage.height * scale;

        const renderX = cardX + (cardWidth - renderW) / 2;
        const renderY = cardY + (cardHeight - renderH) / 2;

        ctx.drawImage(cardImage, renderX, renderY, renderW, renderH);
      }

      // 4. Render Player Name
      const textLeftMargin = 120;
      const textTopMargin = 380;

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 52px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const upperName = nameInput.value.toUpperCase();
      ctx.fillText(upperName, textLeftMargin, textTopMargin);

      // 5. Render Info / Stats Badge
      if (infoInput.value.trim() !== '') {
        const infoText = infoInput.value.toUpperCase();
        ctx.font = '700 22px system-ui, -apple-system, sans-serif';
        const textMetrics = ctx.measureText(infoText);
        
        const badgePaddingX = 14;
        const badgePaddingY = 8;
        const badgeX = textLeftMargin;
        const badgeY = textTopMargin + 38;
        const badgeWidth = textMetrics.width + (badgePaddingX * 2);
        const badgeHeight = 36;

        // Draw green badge box
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 6);
        ctx.fill();

        // Draw badge text
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(infoText, badgeX + (badgeWidth / 2), badgeY + (badgeHeight / 2));
      }

      ctx.restore();
    }

    renderCanvas();

    // Download handler
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'player-review-banner.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });
  </script>
</body>
</html>
